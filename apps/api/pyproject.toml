[project]
name = "agentspace"
version = "0.1.0"
description = "agentspace API: agents, sessions and the agent loop"
readme = "README.md"
authors = [
    { name = "Abdullah", email = "syedabdullah535@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.1",
    "asyncer>=0.0.20",
    "asyncpg>=0.32.0",
    "cryptography>=50.0.2",
    "fastapi[standard]>=0.163.1",
    "greenlet>=3.5.6",
    "httpx>=0.28.1",
    "langfuse>=5.2.0",
    "pillow>=13.0.0",
    "pydantic-settings>=2.16.3",
    "pyjwt[crypto]>=2.15.1",
    "pyyaml>=6.0.3",
    "sqlmodel>=0.0.50",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
    "ty>=0.0.107",
    "types-pyyaml>=6.0.12.20261113",
]

[tool.fastapi]
entrypoint = "agentspace.main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "FAST"]

[tool.ruff.lint.per-file-ignores]
# `session_id` reaches these routes through the SessionRowDep / RunDep dependencies.
"src/agentspace/api/sessions.py" = ["FAST003"]
"src/agentspace/api/mcp_servers.py" = ["FAST003"]

[tool.ty.src]
# A one-off spike that needs the Daytona SDK, which isn't a project dependency.
exclude = ["scripts/spike_daytona.py"]
