# Local Supabase for dev and tests (ADR-027): only its Postgres, the same one hosted Supabase runs.
# `pnpm dev:api` starts it (scripts/db.sh); every checkout shares this one server, each with its own database.
# Sign-in stays on the hosted project (ADR-024), so auth, the REST API, storage and the rest stay off; Studio is on.

project_id = "agentspace"

# Ports start at 55320, so this stack runs next to another project's local Supabase on the 543xx defaults.
[db]
port = 55322
shadow_port = 55320
major_version = 17

[db.pooler]
enabled = false

# Migrations are Alembic's (apps/api/migrations), not Supabase's.
[db.migrations]
enabled = false

[db.seed]
enabled = false

[api]
enabled = false
port = 55321

# Supabase's table viewer: http://localhost:55323. It only reads the `postgres` database, which is the main
# checkout's; a worktree's own database needs psql or a client such as TablePlus.
[studio]
enabled = true
port = 55323

[local_smtp]
enabled = false
port = 55324

[storage]
enabled = false

[auth]
enabled = false

[realtime]
enabled = false

[edge_runtime]
enabled = false

[analytics]
enabled = false
port = 55327
