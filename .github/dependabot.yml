# Opens weekly pull requests that bump outdated dependencies, grouped so it's one PR per ecosystem.
version: 2
updates:
  # The pinned action SHAs in .github/workflows.
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # pnpm workspace (the web app and its tooling).
  - package-ecosystem: npm
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    groups:
      web-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  # The API's uv.lock.
  - package-ecosystem: uv
    directory: /apps/api
    target-branch: dev
    schedule:
      interval: weekly
    groups:
      api-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
