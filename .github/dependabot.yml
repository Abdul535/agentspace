# Opens weekly pull requests that bump outdated dependencies, grouped so it's one PR per ecosystem.
version: 2
updates:
  # The pinned action SHAs in .github/workflows.
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # pnpm workspace (the web app and its tooling).
  - package-ecosystem: npm
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    groups:
      web-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # typescript-eslint (used by eslint-config-next) supports only TypeScript <6.1; lift once it supports 7.
      - dependency-name: typescript
        versions: [">=6.1"]
      # Node types must match the Node major CI runs (24 in ci.yml); bump both together by hand.
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]

  # The API's uv.lock.
  - package-ecosystem: uv
    directory: /apps/api
    target-branch: dev
    schedule:
      interval: weekly
    groups:
      api-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
